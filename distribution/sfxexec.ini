; SFX Door driver settings. Setup creates this file only when missing.
; Keep custom values here; an optional sfxexec.ini in a Door's startup
; directory overrides the shared values for that launch.
; Settings are captured at launch. Existing games keep their captured values.

; Windows SFXEXEC CPU yield interval in milliseconds. Fractional values are
; supported; zero disables this yielding. This is not a Linux CPU setting.
YieldInterval=1.0

; A game's hangup affects only its caller. False makes the game return to the
; BBS instead. Operator Disconnect Caller and normal time/AFK limits still apply.
CanDisconnect=true

[Runtime]
; Optional, separately supplied x64 DOS runtimes are not qualified by this
; release. Changing this does not install a runtime or bypass preflight checks.
AllowX64DOS=false
